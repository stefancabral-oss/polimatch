<title>PoliMatch Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: uma coluna na largura do celular, uma tela por vez. As fotos trazem a cor; o resto fica neutro e um único verde marca a ação. */
:root{
  --bg:#ffffff;--bg2:#f2f5f3;--fg:#0e1513;--fg2:#56625d;--muted:#8a9691;--line:#e2e7e4;
  --accent:#08805a;--on-accent:#ffffff;--accent-soft:#e2f4eb;--scrim:rgba(8,14,12,.5);--danger:#b3392f;--on-photo:#ffffff;
  --display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e0d;--bg2:#151a18;--fg:#f0f4f2;--fg2:#a4b0aa;--muted:#6c7873;--line:#232a27;--accent:#2fd39a;--on-accent:#04140d;--accent-soft:#11281f;--scrim:rgba(0,0,0,.62);--danger:#ff8d84;--on-photo:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e0d;--bg2:#151a18;--fg:#f0f4f2;--fg2:#a4b0aa;--muted:#6c7873;--line:#232a27;--accent:#2fd39a;--on-accent:#04140d;--accent-soft:#11281f;--scrim:rgba(0,0,0,.62);--danger:#ff8d84;--on-photo:#ffffff;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,p,ul{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.stage{height:100%;display:grid;place-items:center}
.app{position:relative;overflow:hidden;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:560px){body{background:var(--bg2)}.app{max-width:412px;max-height:860px;border:1px solid var(--line);border-radius:30px}}

.view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 18px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:fade .24s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.6);opacity:0}}

.sub{color:var(--fg2);font-size:13px}
.lead{font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.title{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.hq{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.hq.sm{font-size:18px;display:flex;align-items:center;gap:8px}
.h2{font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:2px}
.foot{color:var(--muted);font-size:12px;margin-top:auto;padding-top:8px}

.icb{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--fg2)}
.ic{display:block;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:0;font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:transparent;color:var(--accent)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.lnk.mut{color:var(--fg2);font-weight:500;align-self:center;padding:8px 12px}

.art{position:relative;overflow:hidden;display:block;background:var(--bg2)}
.art>svg{position:absolute;inset:0;width:100%;height:100%}

.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--fg)}
.segs.acc i.on{background:var(--accent)}

.week{display:flex;flex-direction:column;gap:8px}
.rowx{display:flex;justify-content:space-between;align-items:baseline}
.lbl{font-weight:600}

.hero{background:var(--bg2);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.hero.done{cursor:default;padding:20px 16px;gap:6px}
.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:132px;border-radius:16px;overflow:hidden}
.htx{display:flex;flex-direction:column;gap:2px;padding:0 4px}

.list{list-style:none;padding:0}
.rowb{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.list li:last-child .rowb{border-bottom:0}
.th{width:46px;height:46px;border-radius:12px;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rq{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{color:var(--fg2);font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.st.ok{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-right:4px}

.tabs{display:flex;justify-content:space-around;padding:6px 0 8px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 18px;cursor:pointer;border-radius:12px}
.tab.on{color:var(--fg)}

.v-vote{gap:8px;overflow:hidden;padding-bottom:14px}
.vbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-inline:-8px}
.stg{text-align:center;font-size:13px;font-weight:600;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vq{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.12;letter-spacing:-.02em;text-wrap:balance;margin-bottom:10px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px 10px}
.enter .grid{animation:slide .3s cubic-bezier(.2,.8,.2,1)}
.opt{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;transition:opacity .25s}
.opt .art{flex:1;min-height:0;border-radius:18px;transition:transform .14s,box-shadow .14s}
.opt:active .art{transform:scale(.97)}
.opt.sel .art{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.opt.dim{opacity:.32}
.nm{font-size:15px;font-weight:500;padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.opt.sel .tick{transform:scale(1)}
.hintp::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--on-photo);animation:pulse 1.4s ease-out 3 both}

.v-close{gap:12px}
.champ{height:clamp(170px,34vh,290px);border-radius:24px;flex:none}
.enter .champ{animation:pop .42s cubic-bezier(.2,.9,.2,1)}
.eyb{font-size:13px;color:var(--fg2)}
.cname{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px}
.fin{display:flex;align-items:center;gap:6px}
.fin .art{width:32px;height:32px;border-radius:50%}
.contrast{font-size:15px}
.teaser{display:flex;align-items:center;gap:12px;background:var(--bg2);border:0;border-radius:16px;padding:12px 14px;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.tz{flex:1;min-width:0;display:flex;flex-direction:column}
.tz b{font-weight:600}
.pill{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.pill.on{color:var(--fg2)}
.vno{font-size:13px;color:var(--fg2)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.card .art{aspect-ratio:4/5;width:100%;border-radius:18px;margin-bottom:6px}
.empty{margin:auto 0;display:flex;flex-direction:column;gap:10px}
.empty .btn{margin-top:8px}

.box{background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.box .btn{margin-top:6px}
.set{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;font-size:16px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}

label,.flbl{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px}
input,select{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:0 14px}
input:disabled{background:var(--bg2);color:var(--muted)}
.tip{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:15px}
.chipb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.err{color:var(--danger);font-size:14px}

.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:8px;animation:up .3s cubic-bezier(.2,.8,.2,1);padding-top:22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .btn.primary{margin-top:10px}
.shead{display:flex;justify-content:space-between;align-items:center}
.scrim.noan,.scrim.noan .sheet{animation:none}
.sheet .set .rt{gap:2px}
.sheet input{margin-top:10px}
.linkbox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:14px;margin-top:10px;font-size:15px}
.linkbox span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-user-select:all;user-select:all}
.special{background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pcard{display:block;height:min(38vh,320px);aspect-ratio:9/16;margin:8px auto 0;border-radius:14px;border:1px solid var(--line)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;width:max-content;max-width:calc(100% - 32px);text-align:center;animation:fade .2s;z-index:5}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="stage"><main class="app" id="app"></main></div>

<script>

var S={tab:'home',view:'home',cur:null,runs:{},reg:false,asked:false,sound:true,hint:true,notify:{},novas:false,canal:'push',refs:0,sheet:null,after:null,form:{age:'',gen:'',uf:''},err:''};
var busy=false,lastKey='',lastSheet=null,toastEl=null,tt=0,ac=null,REFLINK='polimatch.com.br/c/7K2QF';

function tone(f,t0,d){try{if(!S.sound)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();if(ac.state==='suspended')ac.resume();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function blip(){tone(740,0,.09)}
function chord(){tone(660,0,.18);tone(880,.09,.2);tone(1320,.18,.34)}
function vib(){try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}}

function run(id){if(!S.runs[id]){var sv=byId(id);S.runs[id]={groups:chunk(shuffle(SETS[sv.set].map(function(x){return x.id})),4),picks:[null,null,null,null],fin:null,champ:null,step:0,done:false}}return S.runs[id]}
function isDone(id){return !!(S.runs[id]&&S.runs[id].done)}
function nextSurvey(){return SURVEYS.filter(function(s){return !isDone(s.id)})[0]}
function doneCount(){return SURVEYS.filter(function(s){return isDone(s.id)}).length}
function picked(r){return r.picks.filter(Boolean).length}

function openSurvey(id){S.cur=id;var r=run(id);S.view=r.done?'close':'vote';render()}
function goNext(){
  if(!S.reg&&!S.asked){S.asked=true;S.sheet='cpf';render();return}
  var n=nextSurvey();if(n)openSurvey(n.id);else{S.view=S.tab='home';render()}
}
function pick(id,el){
  if(busy)return;busy=true;S.hint=false;blip();vib();
  var all=el.parentNode.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++){all[i].classList.toggle('sel',all[i]===el);all[i].classList.toggle('dim',all[i]!==el)}
  var h=app.querySelector('.hintp');if(h)h.classList.remove('hintp');
  setTimeout(function(){
    busy=false;var r=run(S.cur);
    if(r.step<4){
      if(r.picks[r.step]!==id){r.picks[r.step]=id;r.fin=null;r.champ=null;r.done=false}
      var nx=r.picks.indexOf(null);
      if(nx===-1){if(!r.fin)r.fin=shuffle(r.picks);r.step=4}else r.step=nx;
    }else{r.champ=id;r.done=true;S.view='close';chord()}
    render();
  },450);
}
function toast(m){
  if(toastEl)toastEl.remove();
  toastEl=document.createElement('div');toastEl.className='toast';toastEl.setAttribute('role','status');toastEl.textContent=m;app.appendChild(toastEl);
  clearTimeout(tt);tt=setTimeout(function(){if(toastEl){toastEl.remove();toastEl=null}},2600);
}

var A={
  tab:function(v){S.tab=S.view=v;render()},
  sound:function(){S.sound=!S.sound;if(S.sound)blip();render()},
  open:function(v){openSurvey(v)},
  pick:function(v,t){pick(v,t)},

  avisos:function(){if(!nextSurvey())S.novas=true;S.sheet='avisos';render()},
  avres:function(){S.notify[S.cur]=!S.notify[S.cur];render()},

  copy:function(){try{navigator.clipboard.writeText(REFLINK).then(function(){toast('Link copiado.')},function(){toast('Segure o link para copiar.')})}catch(e){toast('Segure o link para copiar.')}},
  sendinv:function(){toast('Na versão real, abre o compartilhamento do celular.')},
  simref:function(){if(S.refs<3)S.refs++;render();toast(S.refs>=3?'Carta especial liberada.':'Um amigo se cadastrou pelo seu link.')},
  cpf:function(){S.after=S.view==='close'?'close':'me';S.view='cpf';render()},
  sheetyes:function(){S.sheet=null;S.after='next';S.view='cpf';render()},
  sheetno:function(){var s=S.sheet;S.sheet=null;if(s==='cpf')goNext();else render()},
  chip:function(v,t){var u=document.getElementById('uf');if(u)S.form.uf=u.value;S.form[t.getAttribute('data-f')]=v;S.err='';render()},
  cpfback:function(){var af=S.after;S.after=null;if(af==='me'){S.view=S.tab='me'}else S.view='close';render()},
  cpfdone:function(){
    var u=document.getElementById('uf');S.form.uf=u?u.value:'';

  reset:function(){S.runs={};S.reg=false;S.asked=false;S.hint=true;S.notify={};S.novas=false;S.canal='push';S.refs=0;S.form={age:'',gen:'',uf:''};S.cur=null;S.err='';S.view=S.tab='home';render();toast('Demonstração recomeçada.')}
};

  if(nx){
    var r=S.runs[nx.id],started=r&&picked(r)>0;
    var ids=r?r.groups[0]:SETS[nx.set].slice(0,4).map(function(x){return x.id});
    hero='<section class="hero" data-a="open" data-v="'+nx.id+'"><div class="lineup">'+ids.map(function(id){return'<span class="art">'+art(id)+'</span>'}).join('')+'</div><div class="htx"><span class="sub">'+nx.topic+'</span><h1 class="hq">'+nx.q+'</h1></div><button class="btn primary" data-a="open" data-v="'+nx.id+'">'+(started?'Continuar':'Começar')+'</button></section>';
  }else hero='<section class="hero done"><h1 class="hq">Você respondeu tudo</h1><p class="sub lead">São três pesquisas novas por semana. A próxima chega na terça.</p><button class="btn ghost" data-a="avisos">'+(S.novas?'Aviso ligado':'Avisar quando chegar')+'</button></section>';

    var r=S.runs[s.id],th=SETS[s.set][0].id,sub=s.topic,st;
    if(r&&r.done){th=r.champ;sub+=' · '+ITEMS[r.champ].name;st='<span class="st ok" aria-label="Respondida">'+ic('check',20)+'</span>'}

  }).join('');

function vote(){
  var sv=byId(S.cur),r=run(S.cur),ids=r.step<4?r.groups[r.step]:r.fin,cur=r.step<4?r.picks[r.step]:r.champ,segs='';

function render(){
