name: Design Validator

# Chamado por ci.yml (pull_request filtrado por caminho, push para main sem filtro);
# workflow_dispatch continua disponível para execução manual.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci --prefix app
      - name: Test app
        run: npm test --prefix app
      - name: Validate card-art pilot schema, semantics and Docker context
        run: npm run test:card-art-pilot-contract --prefix app
      - name: Build app and verify pilot evidence isolation
        env:
          POLIMATCH_REQUIRE_RELEASE: '1'
        run: |
          npm run build --prefix app
          test "$(jq -r .sha app/dist/version.json)" = "$GITHUB_SHA"
      - name: Build production PWA image from repository-root context and verify its release
        run: |
          docker build --file app/Dockerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --build-arg POLIMATCH_REQUIRE_RELEASE=1 --tag polimatch-app:pilot-176 .
          docker run --rm --entrypoint cat polimatch-app:pilot-176 /usr/share/nginx/html/version.json | tee /tmp/polimatch-version.json
          test "$(jq -r .sha /tmp/polimatch-version.json)" = "$GITHUB_SHA"
          docker run --rm --entrypoint cat polimatch-app:pilot-176 /usr/share/nginx/html/index.html | grep -F "<meta name=\"polimatch-release\" content=\"$GITHUB_SHA\">"
      - name: Smoke the nginx image (compression, cache, 404, robots and icons)
        run: |
          docker run -d --name polimatch-app-smoke -p 127.0.0.1:8080:80 polimatch-app:pilot-176
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            if [ "$i" = 30 ]; then docker logs polimatch-app-smoke; exit 1; fi
            sleep 1
          done
          # O build da imagem gera hashes próprios; o smoke lê o dist servido.
          docker cp polimatch-app-smoke:/usr/share/nginx/html "$RUNNER_TEMP/served-dist"
          node app/scripts/smoke-nginx.mjs http://127.0.0.1:8080/ --dist "$RUNNER_TEMP/served-dist"
      - name: Show nginx logs when the smoke fails
        if: failure()
        run: docker logs polimatch-app-smoke || true
