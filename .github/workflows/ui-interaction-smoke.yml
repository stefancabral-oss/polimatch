name: UI Interaction Smoke

# Chamado por ci.yml (pull_request filtrado por caminho, push para main sem filtro);
# workflow_dispatch continua disponível para execução manual.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  browser-smoke:
    # Versão fixa de propósito. Em 11/2026 `ubuntu-latest` passou a ser o
    # 26.04, e o Playwright 1.55.1 não instala navegador nele ("does not
    # support chromium on ubuntu26.04-x64"). Só voltar a `ubuntu-latest`
    # junto com uma atualização do Playwright que suporte a versão nova.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app
        run: npm ci --prefix app

      - name: Install browser
        run: node app/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Build app and verify pilot evidence isolation
        env:
          VITE_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
          POLIMATCH_REQUIRE_RELEASE: '1'
        run: npm run build --prefix app

      - name: Start preview
        run: |
          npm run preview --prefix app -- --host 127.0.0.1 --port 4173 > /tmp/polimatch-vite.log 2>&1 &
          echo $! > /tmp/polimatch-vite.pid

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/polimatch-vite.log
          exit 1

      - name: Verify release identity served at /version.json
        run: curl -fsS http://127.0.0.1:4173/version.json | jq -e --arg sha "$GITHUB_SHA" '.sha == $sha'

      # Desde a ICM 69 (#331) a capa é a pesquisa por foto. Os roteiros das
      # páginas do produto anterior saíram daqui junto com elas.
      - name: Validate the new home and menu (ICM 69, menu, account, how it works and retired pages)
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/site-shell.mjs

      - name: Validate blocked pilot form against canonical card geometry
        env:
          POLIMATCH_PILOT_BROWSER: ${{ matrix.browser }}
        run: npm run test:card-art-pilot-form --prefix app

      - name: Validate the photo survey on the home (ICM 68, entry, vote, undo, single response and exits)
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
        run: node app/e2e/photo-survey.mjs

      - name: Report forced browser errors to the API without player data
        env:
          POLIMATCH_E2E_BROWSER: ${{ matrix.browser }}
          POLIMATCH_E2E_EXPECT_BUILD: ${{ github.sha }}
        run: node app/e2e/client-error-report.mjs
