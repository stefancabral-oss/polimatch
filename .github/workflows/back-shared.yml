name: Backend and Shared

on:
  pull_request:
    branches: [main]
    paths:
      - 'back/**'
      - 'shared/**'
      - 'stages/10_rebuild_eleicoes_2026/input/polimatch-catalogo-125.json'
      - 'stages/10_rebuild_eleicoes_2026/input/polimatch-perfis-editoriais-125.json'
      - 'stages/10_rebuild_eleicoes_2026/input/polimatch-taxonomia-125.json'
      - 'docs/editorial/**'
      - 'package.json'
      - '.dockerignore'
      - 'scripts/ops/**'
      - '.github/workflows/back-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  back-unit:
    name: back-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - name: Install backend
        run: npm ci --prefix back
      - name: Verify editorial attestations and reviewed commits
        run: npm run editorial:verify --prefix back
        env:
          EDITORIAL_AUTHORITY_PUBLIC_JWK: ${{ secrets.EDITORIAL_AUTHORITY_PUBLIC_JWK }}
          EDITORIAL_AUTHORITY_ISSUER: ${{ secrets.EDITORIAL_AUTHORITY_ISSUER }}
          EDITORIAL_AUTHORITY_KEY_ID: ${{ secrets.EDITORIAL_AUTHORITY_KEY_ID }}
          EDITORIAL_AUTHORITY_RECEIPTS: ${{ secrets.EDITORIAL_AUTHORITY_RECEIPTS }}
      - name: Verify Python for bounded civic ZIP reader
        run: python3 --version
      - name: Test backend
        run: npm test --prefix back
      - name: Build API image and verify recovered photographs are packaged
        run: |
          docker build --file back/Dockerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag polimatch-api:recovery .
          docker run --rm --entrypoint node polimatch-api:recovery --input-type=module -e 'import assert from "node:assert/strict"; import {PRODUCTION_CANDIDATE_REGISTRY as registry} from "./src/candidates.js"; import {EMBEDDED_RELEASE_REVISION} from "./src/release-identity.js"; assert.equal(registry.candidatesForTopic("eleicoes-2026").length,54); assert.match(EMBEDDED_RELEASE_REVISION,/^[a-f0-9]{40}$/); console.log("54 verified photographs and release identity packaged");'
      - name: Verify API image excludes integration smokes and test support
        run: |
          docker run --rm --entrypoint ls polimatch-api:recovery scripts | tee "$RUNNER_TEMP/image-scripts.txt"
          grep -qx 'civic-migrate.mjs' "$RUNNER_TEMP/image-scripts.txt"
          if grep -E -- '-smoke\.mjs$' "$RUNNER_TEMP/image-scripts.txt"; then
            echo "A imagem da API não pode carregar smokes de integração" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh polimatch-api:recovery -c 'test -d src && test ! -e test-support'
          echo "smokes e test-support fora da imagem"

  shared-data:
    name: shared-data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test shared domain and catalog taxonomy
        run: npm run test:shared

  back-integration-postgres:
    name: back-integration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polimatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polimatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/polimatch_test
      # Os smokes apagam dados: só rodam com esta opção, host local e banco *_test.
      POLIMATCH_DISPOSABLE_DB: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - name: Install backend
        run: npm ci --prefix back
      - name: Test PostgreSQL integration
        run: npm run test:integration --prefix back
      - name: Verify ordered two-card choices and receipts
        run: node back/scripts/ordered-choices-smoke.mjs
      - name: Verify presidential pools, existing players and isolated Chroma duels
        run: node back/scripts/presidential-duels-smoke.mjs
      - name: Prove vote abuse is blocked
        run: npm run test:abuse --prefix back
      - name: Verify issued pairs, optional discard and earned inventory
        run: node back/scripts/game-progress-smoke.mjs
      - name: Verify isolated civic schema and rollback without changing game data
        run: node back/scripts/civic-schema-smoke.mjs
        env:
          CIVIC_DISPOSABLE_TEST: '1'
      - name: Prove the API survives dropped connections, bad bodies and lock waits
        run: npm run test:resilience --prefix back
      # pg_dump/pg_restore do próprio container, como no cron da VPS via docker exec.
      - name: Back up with manifest and rehearse the restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          DRILL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/polimatch_drill_test
        run: |
          export PG_DUMP="docker exec -i $PG_CONTAINER pg_dump" PG_RESTORE="docker exec -i $PG_CONTAINER pg_restore"
          BACKUP_DATABASE_URL="$DATABASE_URL" BACKUP_DIR="$RUNNER_TEMP/backups" BACKUP_RELEASE_REVISION="$GITHUB_SHA" \
            bash scripts/ops/pg-backup-vps.sh
          dump=$(ls "$RUNNER_TEMP"/backups/polimatch-*.dump)
          node scripts/ops/drill-local.mjs "$dump" --report "$RUNNER_TEMP/drill.json"
          cp "$dump" "$RUNNER_TEMP/adulterado.dump"
          sed 's/"public.votes": [0-9]*/"public.votes": -1/' "${dump%.dump}.manifest.json" > "$RUNNER_TEMP/adulterado.manifest.json"
          if node scripts/ops/drill-local.mjs "$RUNNER_TEMP/adulterado.dump" --skip-boot > /dev/null; then
            echo "o drill aceitou um manifesto com contagem divergente" >&2
            exit 1
          fi
      # Último passo: recria o schema public para reproduzir a restauração parcial.
      - name: Prove a partial restore aborts the API without changing rows
        run: node back/scripts/partial-restore-smoke.mjs
