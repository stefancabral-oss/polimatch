name: Civic Planning

# Chamado por ci.yml (pull_request filtrado por caminho, push para main sem filtro);
# workflow_dispatch continua disponível para execução manual.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify planning links, sections and dependency order
        run: |
          node --input-type=module <<'NODE'
          import { verifyPlanning } from './stages/17_candidate_news/output/check-planning.mjs';
          const result = await verifyPlanning('.');
          console.log(JSON.stringify({ counts: result.counts, checks: result.checks, status: result.status, errors: result.errors }, null, 2));
          if (result.status !== 'passed') process.exitCode = 1;
          NODE
