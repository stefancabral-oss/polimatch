server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão dos formatos de texto. PNG, JPEG e WebP já chegam comprimidos.
  # text/html entra sempre que gzip está ligado.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # O SW e o manifesto são revalidados a cada visita para que uma versão nova
  # chegue logo depois do deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Identidade do release (#287): precisa refletir o deploy atual.
  location = /version.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos do Vite têm hash no nome: podem ficar em cache por um ano. Um
  # arquivo que não existe responde 404, nunca o index.html.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Páginas HTML sempre revalidam, para nunca pedir assets de um build antigo.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Retratos e Chromas mantêm o mesmo nome entre builds (não têm hash), então
  # ficam um dia em cache e depois revalidam com ETag. Ausente responde 404.
  location ^~ /portraits/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ^~ /chromas/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Demais arquivos estáticos (ícones, marca, robots.txt, sitemap.xml): 404
  # quando não existem, em vez do fallback do app.
  location ~* \.(?:m?js|css|map|json|txt|xml|webmanifest|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp3|mp4|webm|wav|ogg|pdf)$ {
    try_files $uri =404;
  }

  # Caminhos sem extensão continuam caindo no app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
